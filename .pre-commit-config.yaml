repos:
  # Standard pre-commit hooks for basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # The corpus (77 MB bi.tsv) must never be committed; largest legitimate
        # tracked file is ~2 MB (uni.tsv is fetched, not committed).
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
      - id: detect-private-key

  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Security checks with Bandit (config lives in pyproject.toml)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|bench/)

  # Cognitive complexity ratchet: fail any function above 15. The Viterbi
  # decoder sits at 7 after extraction; keep it there.
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v8.0.1
    hooks:
      - id: complexipy
        args: [--max-complexity-allowed=15, vndiacritics]
        pass_filenames: false

  # Dead code detection (high-confidence findings only)
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: [--min-confidence=80, vndiacritics]
        pass_filenames: false

  # Dependency security scanning (requirements.txt mirrors pyproject dependencies)
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.3
    hooks:
      - id: python-safety-dependencies-check
        files: requirements.txt

  # Copy/paste code duplication detection
  - repo: https://github.com/kucherenko/jscpd
    rev: v5.4.0
    hooks:
      - id: jscpd
        args: [vndiacritics]
        pass_filenames: false

  # Validate pyproject.toml structure
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.22
    hooks:
      - id: validate-pyproject
