[project]
name = "vap"
version = "0.1.0"
description = "Vietnamese diacritic restoration"
requires-python = ">=3.11"
dependencies = ["marisa-trie>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vap = "vap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
